name: Rust quality gates

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  rust:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential curl file libasound2-dev libdbus-1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            patchelf pkg-config

      - name: Install pinned Rust toolchain
        run: python3 scripts/check_rust_toolchain.py

      - name: Verify the single-source product version
        run: python3 scripts/release_version.py

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus and Tauri CLIs
        run: |
          cargo install dioxus-cli --version 0.7.10 --locked
          cargo install tauri-cli --version 2.12.4 --locked
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Smoke-test production browser adapters
        working-directory: apps/ui
        run: npm test

      - name: Exercise production UI boundary in a real wasm browser
        working-directory: apps/ui
        run: wasm-pack test --headless --firefox

      - name: Smoke-test Tauri development frontend
        run: python3 scripts/smoke_dev_frontend.py --timeout-seconds 300

      - name: Build Dioxus web frontend
        working-directory: apps/ui
        run: dx build --platform web --release --locked

      - name: Build Tauri application without bundling
        working-directory: apps/desktop
        run: cargo tauri build --no-bundle

  macos:
    name: macOS compile and test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: python3 scripts/check_rust_toolchain.py

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace
