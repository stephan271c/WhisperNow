[workspace]
resolver = "2"
members = [
    "crates/whispernow-domain",
    "crates/whispernow-core",
    "crates/whispernow-platform",
    "crates/whispernow-api",
    "tools/update-signature",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["WhisperNow contributors"]
repository = "https://github.com/stephan271c/WhisperNow"

[workspace.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "tracing"] }
async-trait = "=0.1.89"
base64 = "=0.22.1"
bzip2 = "=0.6.1"
cpal = "=0.18.1"
directories = "=6.0.0"
flate2 = "=1.1.9"
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "minimal"] }
dioxus-ssr = "=0.7.10"
futures-util = "=0.3.33"
gdk = "=0.18.2"
libc = "=0.2.189"
libloading = "=0.8.9"
hound = "=3.5.1"
minisign-verify = "=0.2.5"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false }
objc2-application-services = { version = "=0.3.2", default-features = false }
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-graphics = { version = "=0.3.2", default-features = false }
objc2-foundation = { version = "=0.3.2", default-features = false }
js-sys = "=0.3.104"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "crypto-rust", "sync-secret-service", "windows-native"] }
rig-core = { version = "=0.41.0", default-features = false, features = ["reqwest", "rustls"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rubato = "=4.0.0"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-wasm-bindgen = "=0.6.5"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
sherpa-onnx = { version = "=1.13.6", default-features = false, features = ["static"] }
tar = { version = "=0.4.46", default-features = false }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-build = "=2.6.3"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
time = { version = "=0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = "=2.5.8"
zeroize = "=1.9.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
# Upstream 1.13.6's native result JSON already contains Whisper language and
# segment metadata, but its safe result type discards those fields. Keep the
# pinned wrapper source with the minimal upstreamable result-shape fix until a
# published release exposes the complete native result.
sherpa-onnx = { path = "vendor/sherpa-onnx" }
