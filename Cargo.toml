[workspace]
resolver = "2"
members = [
    "crates/whispernow-domain",
    "crates/whispernow-core",
    "crates/whispernow-platform",
    "apps/ui",
    "apps/desktop",
    "apps/input-helper",
    "tools/update-signature",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["WhisperNow contributors"]
repository = "https://github.com/stephan271c/WhisperNow"

[workspace.dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["image-data"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "tracing"] }
base64 = "=0.23.1"
bzip2 = "=0.6.1"
cpal = "=0.18.2"
directories = "=6.0.0"
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "minimal", "mounted"] }
dioxus-ssr = "=0.7.10"
futures-util = "=0.3.34"
gdk = "=0.18.2"
libc = "=0.2.191"
libloading = "=0.9.0"
hound = "=3.5.1"
minisign-verify = "=0.3.0"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false }
objc2-application-services = { version = "=0.3.2", default-features = false }
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-graphics = { version = "=0.3.2", default-features = false }
objc2-foundation = { version = "=0.3.2", default-features = false }
js-sys = "=0.3.106"
keyring-core = "=1.0.1"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
rig-core = { version = "=0.45.0", default-features = false }
rig-reqwest = { version = "=0.45.0", default-features = false, features = ["rustls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled"] }
rubato = "=5.0.1"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-wasm-bindgen = "=0.6.5"
sha2 = { version = "=0.11.1", features = ["zeroize"] }
sherpa-onnx = { version = "=2.0.0", default-features = false, features = ["static"] }
tar = { version = "=0.4.46", default-features = false }
tauri-build = "=2.7.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-process = "=2.4.0"
# Without `zip`: it only unpacks .zip-wrapped Windows updates, and ours are the NSIS .exe
# (`createUpdaterArtifacts: true`). Its zip 4.6.1 fails `cargo audit` (RUSTSEC-2026-0367..0369).
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.20", default-features = false }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = "=2.5.8"
zeroize = "=1.9.1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Full DWARF for dependencies is ~80% of a ~550 MB debug binary; file:line backtraces need only line tables.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true

# dx builds the web UI with this profile. dioxus-cli 0.7.10 runs `rust-objcopy` on the wasm
# whenever the profile strips: `--strip-all` also removes wasm-bindgen's custom section since
# LLVM 23 (Rust 1.99), and on macOS the tool can't load libLLVM.dylib because dx sets only
# LD_LIBRARY_PATH. The linker strips debug info instead (.cargo/config.toml), with the same
# output. `opt-level` is dx's default for a web release, which a profile defined here replaces.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "none"
