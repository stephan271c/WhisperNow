# Qwen3.5-9B, full fine-tune from the base checkpoint, on a Modal H200 (modal_train.py --gpu H200).
# The 4B's recipe with 8-bit AdamW. transformers loads the text model only, without the vision tower
# or the multi-token-prediction block: 8.95B weights. fp32 weights, gradients and Adam state would take
# 143 GB of the H200's 150 GB, leaving too little for activations. bitsandbytes' 8-bit AdamW brings
# them to about 96 GB (transformers keeps the input embeddings' Adam state in 32 bits); the LFM2.5-350M
# control lost nothing measurable with it. Not a B200: there fla 0.5.2's
# gated delta rule backward gives NaN gradients.
base_model = "Qwen/Qwen3.5-9B-Base"
method = "full"
learning_rate = 1e-5
epochs = 3
# Not the paged variant: on a Modal H200, allocating its state in CUDA managed memory (bitsandbytes
# 0.50.2 `get_paged`) stalled the first optimizer step for 20 minutes with the GPU idle.
optim = "adamw_bnb_8bit"
# 32 rows a step in four micro-batches: epoch 3 peaked at 123.3 GB allocated.
batch_size = 8
grad_accum = 4
warmup = 0.03
weight_decay = 0.0
lr_scheduler = "cosine"
# The longest rendered training row is 2,845 tokens with this tokenizer.
max_length = 3072
seed = 109
gradient_checkpointing = true
chunked_loss = true
# A resumable checkpoint (fp32 weights and 8-bit Adam state) is about 55 GB.
checkpoint_minutes = 60
