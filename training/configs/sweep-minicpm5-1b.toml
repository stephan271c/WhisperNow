# Sweep for MiniCPM5-1B, the full fine-tune half of LFM2.5-350M's stage 1
# (configs/sweep-lfm25-350m.toml): learning rate from the instruct and base checkpoints,
# 1 epoch each. Each run is `minicpm5-1b.toml`, with 8-bit AdamW and frozen input embeddings.
config = "minicpm5-1b.toml"

[[run]]
name = "minicpm-full-inst-1e-5"
set = ["learning_rate=1e-5"]

[[run]]
name = "minicpm-full-inst-3e-5"
set = ["learning_rate=3e-5"]

[[run]]
name = "minicpm-full-inst-1e-4"
set = ["learning_rate=1e-4"]

[[run]]
name = "minicpm-full-base-1e-5"
set = ["base_model='openbmb/MiniCPM5-1B-Base'", "learning_rate=1e-5"]

[[run]]
name = "minicpm-full-base-3e-5"
set = ["base_model='openbmb/MiniCPM5-1B-Base'", "learning_rate=3e-5"]

[[run]]
name = "minicpm-full-base-1e-4"
set = ["base_model='openbmb/MiniCPM5-1B-Base'", "learning_rate=1e-4"]
