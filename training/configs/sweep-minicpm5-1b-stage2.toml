# Stage 2 for MiniCPM5-1B, around the stage 1 winners (see configs/sweep-minicpm5-1b.toml).
# Stage 1 found 1e-4 worst from both checkpoints; base 3e-5 had the lowest val loss and kept
# the most protected tokens, and instruct 1e-5 the best layout and least filler. This stage
# trains longer, as LFM2.5-350M's did (configs/sweep-lfm25-350m-stage2.toml), with the base
# 3e-5 run in place of LFM's instruct 5e-6. Epoch checkpoints are scored too.
config = "minicpm5-1b.toml"

[[run]]
name = "minicpm-full-inst-1e-5-e3"
set = ["learning_rate=1e-5", "epochs=3"]

[[run]]
name = "minicpm-full-base-3e-5-e3"
set = ["base_model='openbmb/MiniCPM5-1B-Base'", "learning_rate=3e-5", "epochs=3"]

[[run]]
name = "minicpm-full-base-1e-5-e3"
set = ["base_model='openbmb/MiniCPM5-1B-Base'", "learning_rate=1e-5", "epochs=3"]

[[run]]
name = "minicpm-full-inst-3e-5-e2"
set = ["learning_rate=3e-5", "epochs=2"]
