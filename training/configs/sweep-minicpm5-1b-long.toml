# Todo 111: todo 109's MiniCPM5-1B recipe (full fine-tune, instruct, lr 1e-5, 3 epochs) retrained
# on todo 110's build, and with fresh noise per epoch, which helped LFM2.5-350M.
config = "minicpm5-1b.toml"

[[run]]
name = "long-minicpm-full-inst-1e-5-e3"
set = ["learning_rate=1e-5", "epochs=3"]

[[run]]
name = "long-minicpm-full-inst-1e-5-e3-noise"
set = ["learning_rate=1e-5", "epochs=3", "noise_per_epoch=true"]
