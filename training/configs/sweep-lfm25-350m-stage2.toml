# Stage 2 for LFM2.5-350M, around the stage 1 winners (see configs/sweep-lfm25-350m.toml).
# Stage 1 found full fine-tuning best at 1e-5 to 3e-5 and LoRA r64 best at 3e-4, with the
# instruct and base checkpoints close. This stage trains longer, tries a lower full rate,
# and varies the LoRA rank.
config = "lfm25-350m.toml"

[[run]]
name = "full-inst-1e-5-e3"
set = ["learning_rate=1e-5", "epochs=3"]

[[run]]
name = "full-base-1e-5-e3"
set = ["base_model='LiquidAI/LFM2.5-350M-Base'", "learning_rate=1e-5", "epochs=3"]

[[run]]
name = "full-inst-5e-6-e3"
set = ["learning_rate=5e-6", "epochs=3"]

[[run]]
name = "full-inst-3e-5-e2"
set = ["learning_rate=3e-5", "epochs=2"]

[[run]]
name = "lora16-inst-3e-4"
set = ["method='lora'", "lora.r=16", "lora.alpha=16", "learning_rate=3e-4", "epochs=1"]

[[run]]
name = "lora256-inst-3e-4"
set = ["method='lora'", "lora.r=256", "lora.alpha=256", "learning_rate=3e-4", "epochs=1"]

[[run]]
name = "lora64-inst-3e-4-e3"
set = ["method='lora'", "learning_rate=3e-4", "epochs=3"]
