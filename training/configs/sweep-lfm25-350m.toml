# Sweep for LFM2.5-350M. Each run is `lfm25-350m.toml` with these overrides; `cleanup sweep`
# trains the runs that have no `runs/<name>/train.json` yet, then scores each on 500 val rows.
# Stage 1 (1 epoch each): learning rate for full fine-tuning and LoRA, from the instruct and base checkpoints.
# Stage 2: epochs, LoRA rank and batch size around the stage 1 winners.
config = "lfm25-350m.toml"

[[run]]
name = "full-inst-1e-5"
set = ["learning_rate=1e-5", "epochs=1"]

[[run]]
name = "full-inst-3e-5"
set = ["learning_rate=3e-5", "epochs=1"]

[[run]]
name = "full-inst-1e-4"
set = ["learning_rate=1e-4", "epochs=1"]

[[run]]
name = "full-base-1e-5"
set = ["base_model='LiquidAI/LFM2.5-350M-Base'", "learning_rate=1e-5", "epochs=1"]

[[run]]
name = "full-base-3e-5"
set = ["base_model='LiquidAI/LFM2.5-350M-Base'", "learning_rate=3e-5", "epochs=1"]

[[run]]
name = "full-base-1e-4"
set = ["base_model='LiquidAI/LFM2.5-350M-Base'", "learning_rate=1e-4", "epochs=1"]

[[run]]
name = "lora64-inst-1e-4"
set = ["method='lora'", "learning_rate=1e-4", "epochs=1"]

[[run]]
name = "lora64-inst-3e-4"
set = ["method='lora'", "learning_rate=3e-4", "epochs=1"]

[[run]]
name = "lora64-inst-1e-3"
set = ["method='lora'", "learning_rate=1e-3", "epochs=1"]

[[run]]
name = "lora64-base-3e-4"
set = ["base_model='LiquidAI/LFM2.5-350M-Base'", "method='lora'", "learning_rate=3e-4", "epochs=1"]

# Control for MiniCPM5-1B, which only fits with 8-bit AdamW: full-inst-1e-5 with that optimizer.
[[run]]
name = "full-inst-1e-5-adam8"
set = ["learning_rate=1e-5", "epochs=1", "optim='paged_adamw_8bit'"]
