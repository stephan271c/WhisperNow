# MiniCPM5-1B, full fine-tune from the instruct checkpoint, on a 12 GB GPU.
# fp32 master weights, gradients and Adam state would take about 17 GB, so this keeps fp32
# master weights under bf16 autocast (as for LFM2.5) but uses bitsandbytes' paged 8-bit AdamW,
# freezes the 200M-parameter input embeddings in bf16, recomputes activations, and uses Liger's
# fused cross-entropy so the 130k-vocabulary logits are never materialized. Each optimizer step
# still sees 32 examples (8 × 4), as LFM2.5's did (16 × 2).
# The sweep (`configs/sweep-minicpm5-1b.toml`) varies these with `--set key=value`.
base_model = "openbmb/MiniCPM5-1B"
method = "full"
learning_rate = 1e-5
epochs = 1
batch_size = 8
grad_accum = 4
warmup = 0.03
weight_decay = 0.0
lr_scheduler = "cosine"
max_length = 1280
seed = 109
optim = "paged_adamw_8bit"
gradient_checkpointing = true
freeze_embeddings = true
liger = true
